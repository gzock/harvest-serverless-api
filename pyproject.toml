[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "harvest-api"
version = "0.1.0"
description = "Harvest serverless API and document generation"
requires-python = ">=3.14,<3.15"
dependencies = [
  "boto3>=1.43.117,<1.44",
  "openpyxl>=3.1.5,<3.2",
  "defusedxml>=0.7.1,<1",
  "Pillow>=13.0.0,<14",
  "chardet>=7.7,<8",
  "python-dateutil>=2.9.0.post0,<3",
  "PyJWT[crypto]>=2.15.1,<3",
  "pydantic>=2.12,<3",
  "aws-lambda-powertools>=3.37,<4",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7,<8",
  "pytest-mock>=3.17,<4",
  "ruff>=0.17.1,<0.18",
  "mypy>=2.4,<3",
  "types-python-dateutil>=2.9",
  "PyYAML>=6,<7",
  "cfn-lint>=1.52,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["decode_verify_jwt"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["harvest*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]
extend-exclude = ["workspace", ".build", ".aws-sam"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
follow_untyped_imports = false
check_untyped_defs = true
files = ["src"]

[tool.uv]
required-version = ">=0.12.23"
