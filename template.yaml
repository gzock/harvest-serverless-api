    Metadata:
      SkipBuild: true
  PhotosFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${PhotosFunction}
      RetentionInDays:
        Ref: LogRetentionDays
  GenerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 300
      MemorySize: 3008
      CodeUri: .build/lambda/
      Handler: harvest.handlers.generate.generate.lambda_handler
      Events:
        GetGeneratedHistory:
          Type: Api
          Properties:
            Path: /projects/{project_id}/generate
            Method: GET
            RestApiId:
              Ref: HarvestApi
        InvokeGenerate:
          Type: Api
          Properties:
            Path: /projects/{project_id}/generate
            Method: POST
