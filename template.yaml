          - s3:ListBucket
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:s3:::${GeneratedBucketName}
        - Effect: Allow
          Action:
          - s3:GetObject
          - s3:GetObjectTagging
          - s3:PutObject
          - s3:PutObjectTagging
          - s3:DeleteObject
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:s3:::${GeneratedBucketName}/*
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          - cognito-idp:AdminListGroupsForUser
          - cognito-idp:GetGroup
          - cognito-idp:ListGroups
          - cognito-idp:ListUsers
          - cognito-idp:ListUsersInGroup
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          Resource:
            Fn::GetAtt:
            - GenerationJobsTable
            - Arn
      Timeout: 300
      MemorySize: 3008
      EphemeralStorage:
        Size: 2048
      ReservedConcurrentExecutions: 5
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - GenerationQueue
              - Arn
            BatchSize: 1
            FunctionResponseTypes:
            - ReportBatchItemFailures
  GenerationOutboxFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      CodeUri: .build/lambda/
      Handler: harvest.jobs.dispatch_handler
      Policies:
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - GenerationQueue
            - QueueName
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - StreamFailureQueue
            - QueueName
      Events:
        Outbox:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
              - GenerationJobsTable
              - StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            FunctionResponseTypes:
            - ReportBatchItemFailures
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 10
            MaximumRecordAgeInSeconds: 86400
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination:
                  Fn::GetAtt:
                  - StreamFailureQueue
                  - Arn
  GenerationJobsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${GenerationJobsFunction}
      RetentionInDays:
        Ref: LogRetentionDays
  GenerationWorkerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${GenerationWorkerFunction}
      RetentionInDays:
        Ref: LogRetentionDays
  GenerationOutboxFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${GenerationOutboxFunction}
      RetentionInDays:
        Ref: LogRetentionDays
  GenerationFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Generation jobs exhausted retries; inspect failed jobs and
        DLQ before redrive.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - GenerationDeadLetterQueue
          - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  GenerationDeadLetterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      CodeUri: .build/lambda/
      Handler: harvest.jobs.dead_letter_handler
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - dynamodb:UpdateItem
          - dynamodb:GetItem
          Resource:
            Fn::GetAtt:
            - GenerationJobsTable
            - Arn
      Events:
        ExhaustedJobs:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - GenerationDeadLetterQueue
              - Arn
            BatchSize: 10
            FunctionResponseTypes:
            - ReportBatchItemFailures
  GenerationDeadLetterFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${GenerationDeadLetterFunction}
      RetentionInDays:
        Ref: LogRetentionDays
  GenerationExhaustedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Generation jobs exhausted retries and were marked failed.
      Namespace: Harvest
      MetricName: ExhaustedJobs
      Dimensions:
      - Name: service
        Value: generation-worker
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  UploadSessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: session_id
        AttributeType: S
      KeySchema:
      - AttributeName: session_id
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
        - AllowedOrigins:
          - Ref: CorsOrigin
          AllowedMethods:
          - POST
          AllowedHeaders:
          - Content-Type
          ExposedHeaders:
          - x-amz-version-id
          MaxAge: 300
      LifecycleConfiguration:
        Rules:
        - Id: ExpireQuarantine
          Status: Enabled
          Prefix: quarantine/
          ExpirationInDays: 8
          NoncurrentVersionExpiration:
            NoncurrentDays: 8
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 1
  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: UploadBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - Fn::GetAtt:
            - UploadBucket
            - Arn
          - Fn::Sub: ${UploadBucket.Arn}/*
          Condition:
            Bool:
              aws:SecureTransport: 'false'
  UploadSessionsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      CodeUri: .build/lambda/
      Handler: harvest.http_api.lambda_handler
      Timeout: 60
      MemorySize: 1024
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: &id004
          - dynamodb:GetItem
          - dynamodb:Query
          - dynamodb:Scan
          - dynamodb:BatchGetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:BatchWriteItem
          - dynamodb:ConditionCheckItem
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectsTableName}
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectsTableName}/index/*
        - Effect: Allow
          Action: *id004
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PlacesTableName}
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PlacesTableName}/index/*
        - Effect: Allow
          Action: *id004
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TargetsTableName}
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TargetsTableName}/index/*
        - Effect: Allow
          Action: *id004
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RolesTableName}
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RolesTableName}/index/*
        - Effect: Allow
          Action:
          - s3:ListBucket
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:s3:::${PhotosBucketName}
        - Effect: Allow
          Action:
          - s3:GetObject
          - s3:GetObjectTagging
          - s3:PutObject
          - s3:PutObjectTagging
          - s3:DeleteObject
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:s3:::${PhotosBucketName}/*
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          - cognito-idp:AdminListGroupsForUser
          - cognito-idp:GetGroup
          - cognito-idp:ListGroups
          - cognito-idp:ListUsers
          - cognito-idp:ListUsersInGroup
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          Resource:
            Fn::GetAtt:
            - UploadSessionsTable
            - Arn
        - Effect: Allow
          Action:
          - s3:PutObject
          - s3:GetObject
          - s3:GetObjectVersion
          Resource:
            Fn::Sub: ${UploadBucket.Arn}/quarantine/*
      Events:
        CreateUpload:
          Type: Api
          Properties:
            Path: /projects/{project_id}/targets/{target_id}/upload-sessions
            Method: POST
            RestApiId:
              Ref: HarvestApi
        CompleteUpload:
          Type: Api
          Properties:
            Path: /projects/{project_id}/targets/{target_id}/upload-sessions/{session_id}/complete
            Method: POST
            RestApiId:
              Ref: HarvestApi
  UploadSessionsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${UploadSessionsFunction}
      RetentionInDays:
        Ref: LogRetentionDays
  ImportsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: project_id
        AttributeType: S
      - AttributeName: operation_id
        AttributeType: S
      KeySchema:
      - AttributeName: project_id
        KeyType: HASH
      - AttributeName: operation_id
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  GenerationRecoveryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      CodeUri: .build/lambda/
      Handler: harvest.jobs.reconciliation_handler
      Timeout: 60
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
          Resource:
            Fn::GetAtt:
            - GenerationJobsTable
            - Arn
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
            Fn::Sub: ${GenerationJobsTable.Arn}/index/StatusUpdatedIndex
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - GenerationQueue
            - QueueName
      Events:
        Recover:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 300
            DeadLetterConfig:
              Arn:
                Fn::GetAtt:
                - StreamFailureQueue
                - Arn
  GenerationRecoveryFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${GenerationRecoveryFunction}
      RetentionInDays:
        Ref: LogRetentionDays
  ImportRecoveryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: true
    Properties:
      CodeUri: .build/lambda/
      Handler: harvest.import_recovery.handler
      Timeout: 60
      ReservedConcurrentExecutions: 1
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - dynamodb:Scan
          - dynamodb:GetItem
          - dynamodb:UpdateItem
          Resource:
            Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectsTableName}
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          Resource:
            Fn::GetAtt:
            - ImportsTable
            - Arn
        - Effect: Allow
          Action:
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PlacesTableName}
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TargetsTableName}
      Events:
        Recover:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 300
            DeadLetterConfig:
              Arn:
                Fn::GetAtt:
                - StreamFailureQueue
                - Arn
  ImportRecoveryFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ImportRecoveryFunction}
      RetentionInDays:
        Ref: LogRetentionDays
Outputs:
  ApiUrl:
    Value:
      Fn::Sub: https://${HarvestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}
  StreamFailureQueueUrl:
    Value:
      Ref: StreamFailureQueue
