AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Harvest API. Existing Cognito, DynamoDB and S3 resources are supplied
  explicitly.
Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
    - dev
    - staging
    - prod
    Default: dev
  CorsOrigin:
    Type: String
    AllowedPattern: https?://[^/]+
    Description: Exact web origin including scheme, without a trailing slash.
  CognitoUserPoolId:
    Type: String
    AllowedPattern: '[a-z0-9-]+_[A-Za-z0-9]+'
  CognitoClientId:
    Type: String
    MinLength: 1
  ProjectsTableName:
    Type: String
    Description: Existing table; managed separately. No table replacement is performed.
  PlacesTableName:
    Type: String
    Description: Existing table; managed separately. No table replacement is performed.
  TargetsTableName:
    Type: String
    Description: Existing table; managed separately. No table replacement is performed.
  RolesTableName:
    Type: String
    Description: Existing table; managed separately. No table replacement is performed.
  NotificationsTableName:
    Type: String
    Description: Existing table; managed separately. No table replacement is performed.
  BillsTableName:
    Type: String
    Description: Existing table; managed separately. No table replacement is performed.
  PhotosBucketName:
    Type: String
    MinLength: 3
    Description: Existing private S3 bucket.
  GeneratedBucketName:
    Type: String
    MinLength: 3
    Description: Existing private S3 bucket.
  RepositoryBucketName:
    Type: String
    MinLength: 3
    Description: Existing private S3 bucket.
  ProjectsStreamArn:
    Type: String
    AllowedPattern: arn:[^:]+:dynamodb:[^:]+:[0-9]+:table/.+/stream/.+
  PlacesStreamArn:
    Type: String
    AllowedPattern: arn:[^:]+:dynamodb:[^:]+:[0-9]+:table/.+/stream/.+
  TargetsStreamArn:
    Type: String
    AllowedPattern: arn:[^:]+:dynamodb:[^:]+:[0-9]+:table/.+/stream/.+
  RolesStreamArn:
    Type: String
    AllowedPattern: arn:[^:]+:dynamodb:[^:]+:[0-9]+:table/.+/stream/.+
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
    - 7
    - 14
    - 30
    - 60
    - 90
    - 180
    - 365
  UploadActorHourlyLimit:
    Type: Number
    MinValue: 1
    Default: 100
  UploadTargetWindowLimit:
    Type: Number
    MinValue: 1
    Default: 10
  UploadTargetWindowSeconds:
    Type: Number
    MinValue: 1
    Default: 900
Globals:
  Function:
    Runtime: python3.14
    Architectures:
    - x86_64
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        COGNITO_USER_POOL_ID:
          Ref: CognitoUserPoolId
        COGNITO_CLIENT_ID:
          Ref: CognitoClientId
        COGNITO_REGION:
          Ref: AWS::Region
        CORS_ORIGIN:
          Ref: CorsOrigin
        DYNAMO_HOST: ''
        DYNAMO_PORT: ''
        POWERTOOLS_SERVICE_NAME: harvest-api
        LOG_LEVEL: INFO
        TABLE_PROJECTS:
          Ref: ProjectsTableName
        TABLE_PLACES:
          Ref: PlacesTableName
        TABLE_TARGETS:
          Ref: TargetsTableName
        TABLE_ROLES:
          Ref: RolesTableName
        TABLE_NOTIFICATIONS:
          Ref: NotificationsTableName
        TABLE_BILLS:
          Ref: BillsTableName
        PHOTOS_BUCKET_NAME:
          Ref: PhotosBucketName
        GENERATED_BUCKET_NAME:
          Ref: GeneratedBucketName
        REPOSITORY_BUCKET_NAME:
          Ref: RepositoryBucketName
        GENERATION_JOBS_TABLE:
          Ref: GenerationJobsTable
        GENERATION_QUEUE_URL:
          Ref: GenerationQueue
        UPLOAD_BUCKET_NAME:
          Ref: UploadBucket
        UPLOAD_SESSIONS_TABLE:
          Ref: UploadSessionsTable
        UPLOAD_ACTOR_HOURLY_LIMIT:
          Ref: UploadActorHourlyLimit
        UPLOAD_TARGET_WINDOW_LIMIT:
          Ref: UploadTargetWindowLimit
        UPLOAD_TARGET_WINDOW_SECONDS:
          Ref: UploadTargetWindowSeconds
        TABLE_IMPORTS:
          Ref: ImportsTable
Resources:
  HarvestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName:
        Ref: EnvironmentName
      EndpointConfiguration: REGIONAL
      Cors:
        AllowOrigin:
          Fn::Sub: '''${CorsOrigin}'''
        AllowHeaders: '''Content-Type,Authorization,Idempotency-Key'''
        AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Fn::Sub: arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
            Identity:
              Header: Authorization
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin:
                Fn::Sub: '''${CorsOrigin}'''
              Access-Control-Allow-Headers: '''Content-Type,Authorization'''
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin:
                Fn::Sub: '''${CorsOrigin}'''
              Access-Control-Allow-Headers: '''Content-Type,Authorization'''
  StreamFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  ScheduleFailureQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: StreamFailureQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sqs:SendMessage
          Resource:
            Fn::GetAtt:
            - StreamFailureQueue
            - Arn
          Condition:
            ArnEquals:
              aws:SourceArn:
              - Fn::GetAtt:
                - BillDispatcherFunctionBillCalculationForEachMonth
                - Arn
              - Fn::GetAtt:
                - GenerationRecoveryFunctionRecover
                - Arn
              - Fn::GetAtt:
                - ImportRecoveryFunctionRecover
                - Arn
  StreamFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Failed DynamoDB stream records require redrive from StreamFailureQueue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - StreamFailureQueue
          - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  ProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 120
      CodeUri: .build/lambda/
      Handler: harvest.handlers.projects.projects.lambda_handler
      Events:
        GetProjects:
          Type: Api
          Properties:
            Path: /projects
            Method: GET
            RestApiId:
              Ref: HarvestApi
        CreateProject:
          Type: Api
          Properties:
            Path: /projects
            Method: POST
            RestApiId:
              Ref: HarvestApi
        GetProject:
          Type: Api
          Properties:
            Path: /projects/{project_id}
            Method: GET
            RestApiId:
              Ref: HarvestApi
        UpdateProject:
          Type: Api
          Properties:
            Path: /projects/{project_id}
            Method: PUT
            RestApiId:
              Ref: HarvestApi
        DeleteProject:
          Type: Api
          Properties:
            Path: /projects/{project_id}
            Method: DELETE
            RestApiId:
              Ref: HarvestApi
        BatchImport:
          Type: Api
          Properties:
            Path: /projects/{project_id}/import
            Method: POST
            RestApiId:
              Ref: HarvestApi
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: &id001
          - dynamodb:GetItem
          - dynamodb:Query
          - dynamodb:Scan
          - dynamodb:BatchGetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:BatchWriteItem
          - dynamodb:ConditionCheckItem
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectsTableName}
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectsTableName}/index/*
        - Effect: Allow
          Action: *id001
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PlacesTableName}
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PlacesTableName}/index/*
        - Effect: Allow
          Action: *id001
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TargetsTableName}
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TargetsTableName}/index/*
        - Effect: Allow
          Action: *id001
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RolesTableName}
          - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RolesTableName}/index/*
        - Effect: Allow
          Action:
          - s3:ListBucket
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:s3:::${PhotosBucketName}
        - Effect: Allow
          Action:
          - s3:GetObject
          - s3:GetObjectTagging
          - s3:PutObject
          - s3:PutObjectTagging
          - s3:DeleteObject
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:s3:::${PhotosBucketName}/*
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          - cognito-idp:AdminListGroupsForUser
          - cognito-idp:GetGroup
          - cognito-idp:ListGroups
          - cognito-idp:ListUsers
          - cognito-idp:ListUsersInGroup
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:Query
          Resource:
            Fn::GetAtt:
            - ImportsTable
            - Arn
    Metadata:
      SkipBuild: true
  ProjectsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ProjectsFunction}
      RetentionInDays:
        Ref: LogRetentionDays
