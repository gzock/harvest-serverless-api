name: API quality

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports:
          - 18000:8000
    env:
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_EC2_METADATA_DISABLED: 'true'
      DYNAMODB_LOCAL_ENDPOINT: http://127.0.0.1:18000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check src tests scripts
      - run: uv run --frozen mypy
      - run: uv run --frozen python scripts/export_contract.py --check
      - name: Wait for local DynamoDB
        run: |
          uv run --frozen python - <<'PY'
          import os
          import time
          import boto3
          from botocore.config import Config
          client = boto3.client('dynamodb', endpoint_url=os.environ['DYNAMODB_LOCAL_ENDPOINT'], config=Config(connect_timeout=1, read_timeout=1, retries={'max_attempts': 0}))
          for attempt in range(30):
              try:
                  client.list_tables()
                  break
              except client.exceptions.ClientError:
                  raise
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
      - run: uv run --frozen pytest --junitxml=test-results/pytest.xml
      - run: make package
      - run: uv tool run --from aws-sam-cli==1.169.0 sam validate --lint
      - run: uv tool run --from aws-sam-cli==1.169.0 sam build
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: test-results/
          retention-days: 7
      - name: Validated deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-build-${{ github.sha }}
          path: |
            .build/lambda/
            .aws-sam/build/template.yaml
          include-hidden-files: true
          retention-days: 7
